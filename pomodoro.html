<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pomodoro - In the Zone</title>
  <style>
    :root{
      --bgTop:#ffffff;
      --badge:#dff2df;
      --badgeText:#2f6b3a;

      --timerText:#1a1a1a;

      --sky:#4fb6e6;      /* 藍底 */
      --road:#2f3338;     /* 路 */
      --roadLine:#d9dde3; /* 虛線 */
      --sidewalk:#b7bcc4; /* 路肩 */

      --gDark:#233a93;
      --gMid:#2f4fb2;
      --gLight:#6fd0ff;
      --board:#f2c21a;

      --shadow: 0 20px 60px rgba(0,0,0,.16);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#f1f2f5;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans TC", Arial, sans-serif;
    }

    /* 手機截圖那種圓角卡片 */
    .phone{
      width:min(520px, 92vw);
      aspect-ratio: 9/16;
      border-radius:28px;
      overflow:hidden;
      background:var(--bgTop);
      box-shadow: var(--shadow);
      position:relative;
    }

    .top{
      height:46%;
      background:var(--bgTop);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding-top:30px;
      position:relative;
    }

    .badge{
      padding:10px 22px;
      background:var(--badge);
      color:var(--badgeText);
      border-radius:999px;
      font-weight:800;
      letter-spacing:.06em;
      font-size:18px;
      line-height:1;
      box-shadow: 0 6px 16px rgba(0,0,0,.08);
    }

    .timer{
      margin-top:22px;
      font-weight:900;
      font-size: clamp(64px, 14vw, 120px);
      color:var(--timerText);
      letter-spacing:-.04em;
      line-height:1;
      user-select:none;
    }

    /* 讓上半部看起來像圖：下緣略斜切 */
    .top::after{
      content:"";
      position:absolute;
      left:-10%;
      right:-10%;
      bottom:-34px;
      height:90px;
      background:var(--sky);
      transform: skewY(-6deg);
    }

    .bottom{
      height:54%;
      background:var(--sky);
      position:relative;
    }

    /* 路面 */
    .road{
      position:absolute;
      left:0; right:0;
      bottom:0;
      height:24%;
      background:var(--road);
      box-shadow: inset 0 10px 0 rgba(255,255,255,.06);
    }
    .road::before{
      /* 路肩 */
      content:"";
      position:absolute;
      left:0; right:0;
      bottom:0;
      height:30%;
      background:var(--sidewalk);
      opacity:.9;
    }
    .road::after{
      /* 虛線 */
      content:"";
      position:absolute;
      left:6%;
      right:6%;
      top:44%;
      height:8px;
      background:
        repeating-linear-gradient(
          90deg,
          var(--roadLine) 0 34px,
          transparent 34px 62px
        );
      opacity:.85;
      border-radius:999px;
      filter: blur(.1px);
    }

    /* 小 G 角色 + 滑板 */
    .g-wrap{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom:18%;
      width:min(220px, 55%);
      aspect-ratio: 1/1.05;
      display:grid;
      place-items:center;
    }

    .g{
      width:100%;
      height:100%;
      position:relative;
    }

    /* G 本體（用簡單幾何組合出卡通感） */
    .g-body{
      position:absolute;
      inset:10% 14% 18% 14%;
      border-radius: 46% 54% 58% 42% / 55% 58% 42% 45%;
      background: radial-gradient(120px 120px at 65% 35%, var(--gMid), var(--gDark));
      box-shadow: 0 18px 26px rgba(0,0,0,.18);
    }

    /* 內圈亮色（像字母 G 的內凹） */
    .g-inner{
      position:absolute;
      inset:26% 24% 32% 24%;
      border-radius: 52% 48% 54% 46% / 52% 52% 48% 48%;
      background: linear-gradient(145deg, rgba(111,208,255,.95), rgba(111,208,255,.6));
      transform: rotate(-6deg);
      filter:saturate(1.05);
    }

    /* 內凹的洞（中間深色），做出 G 的開口感 */
    .g-hole{
      position:absolute;
      left:38%;
      top:42%;
      width:44%;
      height:26%;
      border-radius: 999px;
      background: rgba(26,36,88,.55);
      transform: rotate(-4deg);
      box-shadow: inset 0 6px 10px rgba(0,0,0,.22);
    }

    /* 右側缺口：用遮罩塊把 G “咬掉” */
    .g-cut{
      position:absolute;
      right:10%;
      top:46%;
      width:22%;
      height:30%;
      background: var(--sky);
      border-radius: 14px;
      transform: rotate(8deg);
    }

    /* 兩顆眼睛 */
    .eye{
      position:absolute;
      top:24%;
      width:22px;
      height:22px;
      border-radius:50%;
      background:#fff;
      box-shadow: 0 6px 10px rgba(0,0,0,.12);
    }
    .eye.left{ left:34%; }
    .eye.right{ left:48%; }

    .pupil{
      position:absolute;
      width:9px; height:9px;
      border-radius:50%;
      background:#111;
      left:9px; top:8px;
    }

    /* 腿 */
    .leg{
      position:absolute;
      bottom:7%;
      width:16px;
      height:42px;
      background: radial-gradient(18px 30px at 50% 20%, var(--gMid), var(--gDark));
      border-radius: 12px;
      box-shadow: 0 8px 14px rgba(0,0,0,.18);
    }
    .leg.left{ left:38%; }
    .leg.right{ left:52%; height:44px; }

    /* 滑板 */
    .board{
      position:absolute;
      bottom:0%;
      left:22%;
      width:56%;
      height:20px;
      background: var(--board);
      border-radius: 999px;
      box-shadow: 0 12px 18px rgba(0,0,0,.18);
    }
    .wheel{
      position:absolute;
      bottom:-8px;
      width:18px;
      height:18px;
      border-radius:50%;
      background:#202226;
      box-shadow: inset 0 4px 6px rgba(255,255,255,.08);
    }
    .wheel.left{ left:18%; }
    .wheel.right{ right:18%; }

    /* 控制列（不破壞畫面：右下角淡淡的隱藏區） */
    .controls{
      position:absolute;
      right:14px;
      top:14px;
      display:flex;
      gap:8px;
      opacity:.0;         /* 預設完全隱形，滑過才顯示，畫面就跟你圖一樣乾淨 */
      transition: opacity .2s ease;
    }
    .phone:hover .controls{ opacity:.95; }

    button{
      border:0;
      background:#111;
      color:#fff;
      padding:8px 12px;
      border-radius:10px;
      font-weight:800;
      cursor:pointer;
    }
    button.secondary{ background:#2c2f35; }
    button.ghost{ background:rgba(17,17,17,.16); color:#111; backdrop-filter: blur(6px); }
  </style>
</head>

<body>
  <div class="phone" id="app">
    <div class="controls">
      <button class="ghost" id="modeBtn" title="切換：25/5">25/5</button>
      <button class="secondary" id="resetBtn" title="重置">Reset</button>
      <button id="startBtn" title="開始/暫停">Start</button>
    </div>

    <div class="top">
      <div class="badge">IN THE ZONE</div>
      <div class="timer" id="timerText">24:48</div>
    </div>

    <div class="bottom">
      <div class="g-wrap" aria-hidden="true">
        <div class="g">
          <div class="g-body"></div>
          <div class="g-inner"></div>
          <div class="g-hole"></div>
          <div class="g-cut"></div>

          <div class="eye left"><div class="pupil"></div></div>
          <div class="eye right"><div class="pupil"></div></div>

          <div class="leg left"></div>
          <div class="leg right"></div>

          <div class="board">
            <div class="wheel left"></div>
            <div class="wheel right"></div>
          </div>
        </div>
      </div>

      <div class="road"></div>
    </div>
  </div>

  <script>
    // ===== 番茄鐘邏輯（預設 25:00 工作 / 05:00 休息）=====
    const timerEl = document.getElementById('timerText');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const modeBtn  = document.getElementById('modeBtn');

    let WORK_MIN = 25;
    let BREAK_MIN = 5;

    let phase = "work";   // "work" | "break"
    let remaining = WORK_MIN * 60; // seconds
    let running = false;
    let t = null;

    // 你圖上是 24:48，我先讓畫面一打開就長那樣（更像）
    // 真正開始按 Start 後會以 remaining 為準跑倒數
    function setDisplay(seconds){
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      timerEl.textContent = String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');
      document.title = `${timerEl.textContent} · IN THE ZONE`;
    }

    function tick(){
      remaining--;
      if (remaining <= 0){
        // 切換 work/break
        phase = (phase === "work") ? "break" : "work";
        remaining = (phase === "work" ? WORK_MIN : BREAK_MIN) * 60;
        // 小提示音（很輕微）
        try{
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.value = 740;
          g.gain.value = 0.05;
          o.start();
          setTimeout(()=>{ o.stop(); ctx.close(); }, 140);
        }catch(e){}
      }
      setDisplay(remaining);
    }

    function start(){
      if (running) return;
      running = true;
      startBtn.textContent = "Pause";
      t = setInterval(tick, 1000);
    }

    function pause(){
      running = false;
      startBtn.textContent = "Start";
      if (t) clearInterval(t);
      t = null;
    }

    function reset(){
      pause();
      phase = "work";
      remaining = WORK_MIN * 60;
      setDisplay(remaining);
    }

    startBtn.addEventListener('click', ()=>{
      running ? pause() : start();
    });

    resetBtn.addEventListener('click', reset);

    modeBtn.addEventListener('click', ()=>{
      // 在 25/5 與 50/10 兩種模式切換（你也可以自己改）
      const isA = (WORK_MIN === 25 && BREAK_MIN === 5);
      WORK_MIN = isA ? 50 : 25;
      BREAK_MIN = isA ? 10 : 5;
      modeBtn.textContent = `${WORK_MIN}/${BREAK_MIN}`;
      reset();
    });

    // 初始顯示先做成你圖上的 24:48（視覺一致）
    // 但內部 remaining 仍維持番茄 25:00，按 Reset 可回 25:00
    setDisplay(24*60 + 48);
  </script>
</body>
</html>
