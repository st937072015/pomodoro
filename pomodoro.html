<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IN THE ZONE</title>
  <style>
    :root{
      --bgTop:#ffffff;
      --badge:#dff2df;
      --badgeText:#2f6b3a;

      --timerText:#1a1a1a;

      --sky:#4fb6e6;
      --road:#2f3338;
      --roadLine:#d9dde3;
      --sidewalk:#b7bcc4;

      --gDark:#233a93;
      --gMid:#2f4fb2;
      --board:#f2c21a;

      --shadow: 0 20px 60px rgba(0,0,0,.16);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#f1f2f5;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans TC", Arial, sans-serif;
    }

    .phone{
      width:min(520px, 92vw);
      aspect-ratio: 9/16;
      border-radius:28px;
      overflow:hidden;
      background:var(--bgTop);
      box-shadow: var(--shadow);
      position:relative;
      user-select:none;
      touch-action: manipulation;
    }

    .top{
      height:46%;
      background:var(--bgTop);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding-top:30px;
      position:relative;
    }

    .badge{
      padding:10px 22px;
      background:var(--badge);
      color:var(--badgeText);
      border-radius:999px;
      font-weight:800;
      letter-spacing:.06em;
      font-size:18px;
      line-height:1;
      box-shadow: 0 6px 16px rgba(0,0,0,.08);
    }

    .timer{
      margin-top:22px;
      font-weight:900;
      font-size: clamp(64px, 14vw, 120px);
      color:var(--timerText);
      letter-spacing:-.04em;
      line-height:1;
      cursor:pointer;
    }

    .hint{
      margin-top:10px;
      font-size:14px;
      color:rgba(0,0,0,.45);
      font-weight:700;
      letter-spacing:.02em;
    }

    .top::after{
      content:"";
      position:absolute;
      left:-10%;
      right:-10%;
      bottom:-34px;
      height:90px;
      background:var(--sky);
      transform: skewY(-6deg);
    }

    .bottom{
      height:54%;
      background:var(--sky);
      position:relative;
    }

    .road{
      position:absolute;
      left:0; right:0;
      bottom:0;
      height:24%;
      background:var(--road);
      box-shadow: inset 0 10px 0 rgba(255,255,255,.06);
    }
    .road::before{
      content:"";
      position:absolute;
      left:0; right:0;
      bottom:0;
      height:30%;
      background:var(--sidewalk);
      opacity:.9;
    }
    .road::after{
      content:"";
      position:absolute;
      left:6%;
      right:6%;
      top:44%;
      height:8px;
      background:
        repeating-linear-gradient(
          90deg,
          var(--roadLine) 0 34px,
          transparent 34px 62px
        );
      opacity:.85;
      border-radius:999px;
    }

    .g-wrap{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom:18%;
      width:min(220px, 55%);
      aspect-ratio: 1/1.05;
      display:grid;
      place-items:center;
      pointer-events:none;
    }
    .g{ width:100%; height:100%; position:relative; }
    .g-body{
      position:absolute;
      inset:10% 14% 18% 14%;
      border-radius: 46% 54% 58% 42% / 55% 58% 42% 45%;
      background: radial-gradient(120px 120px at 65% 35%, var(--gMid), var(--gDark));
      box-shadow: 0 18px 26px rgba(0,0,0,.18);
    }
    .g-cut{
      position:absolute;
      right:10%;
      top:46%;
      width:22%;
      height:30%;
      background: var(--sky);
      border-radius: 14px;
      transform: rotate(8deg);
    }
    .g-hole{
      position:absolute;
      left:38%;
      top:42%;
      width:44%;
      height:26%;
      border-radius: 999px;
      background: rgba(26,36,88,.55);
      transform: rotate(-4deg);
      box-shadow: inset 0 6px 10px rgba(0,0,0,.22);
    }
    .eye{
      position:absolute;
      top:24%;
      width:22px;
      height:22px;
      border-radius:50%;
      background:#fff;
      box-shadow: 0 6px 10px rgba(0,0,0,.12);
    }
    .eye.left{ left:34%; }
    .eye.right{ left:48%; }
    .pupil{
      position:absolute;
      width:9px; height:9px;
      border-radius:50%;
      background:#111;
      left:9px; top:8px;
    }
    .leg{
      position:absolute;
      bottom:7%;
      width:16px;
      height:42px;
      background: radial-gradient(18px 30px at 50% 20%, var(--gMid), var(--gDark));
      border-radius: 12px;
      box-shadow: 0 8px 14px rgba(0,0,0,.18);
    }
    .leg.left{ left:38%; }
    .leg.right{ left:52%; height:44px; }
    .board{
      position:absolute;
      bottom:0%;
      left:22%;
      width:56%;
      height:20px;
      background: var(--board);
      border-radius: 999px;
      box-shadow: 0 12px 18px rgba(0,0,0,.18);
    }
    .wheel{
      position:absolute;
      bottom:-8px;
      width:18px;
      height:18px;
      border-radius:50%;
      background:#202226;
      box-shadow: inset 0 4px 6px rgba(255,255,255,.08);
    }
    .wheel.left{ left:18%; }
    .wheel.right{ right:18%; }

    /* 右上角「不破壞畫面」控制區：平常幾乎看不到 */
    .controls{
      position:absolute;
      right:12px;
      top:12px;
      display:flex;
      gap:8px;
      opacity:.06;
      transition: opacity .18s ease;
      z-index:10;
    }
    .phone:hover .controls,
    .controls.show{
      opacity:.95;
    }
    .btn{
      border:0;
      padding:8px 12px;
      border-radius:10px;
      font-weight:900;
      cursor:pointer;
      background:#111;
      color:#fff;
    }
    .btn.secondary{ background:#2c2f35; }
    .btn.ghost{
      background:rgba(255,255,255,.65);
      color:#111;
      backdrop-filter: blur(8px);
    }

    /* 設定面板（彈出，不破壞主畫面） */
    .sheet{
      position:absolute;
      left:0; right:0;
      bottom:-420px;
      padding:14px 14px 18px;
      background:rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      border-top-left-radius:22px;
      border-top-right-radius:22px;
      box-shadow: 0 -18px 40px rgba(0,0,0,.18);
      transition: transform .22s ease;
      transform: translateY(0);
      z-index:20;
    }
    .sheet.open{ transform: translateY(-420px); }
    .sheet .row{
      display:flex;
      gap:10px;
      align-items:center;
      margin:10px 0;
    }
    .sheet h3{
      margin:4px 2px 10px;
      font-size:16px;
      letter-spacing:.02em;
    }
    .pill{
      border:0;
      padding:10px 12px;
      border-radius:999px;
      font-weight:900;
      cursor:pointer;
      background:#111;
      color:#fff;
    }
    .pill.light{ background:#e9edf3; color:#111; }
    .field{
      flex:1;
      display:flex;
      gap:8px;
      align-items:center;
    }
    input[type="number"]{
      width:92px;
      padding:10px 10px;
      border-radius:12px;
      border:1px solid rgba(0,0,0,.15);
      font-weight:800;
      font-size:14px;
      outline:none;
    }
    label{
      font-weight:900;
      font-size:14px;
      color:#111;
    }
    .toggle{
      display:flex;
      gap:8px;
      align-items:center;
      font-weight:800;
      font-size:14px;
    }
    .toggle input{ transform: scale(1.15); }

    /* 小狀態點 */
    .statusDot{
      display:inline-block;
      width:10px; height:10px;
      border-radius:999px;
      background:#bbb;
      margin-left:8px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,.18);
      vertical-align: middle;
    }
    .statusDot.running{ background:#20c997; }
    .statusDot.break{ background:#ffb020; }
  </style>
</head>

<body>
  <div class="phone" id="app">
    <div class="controls" id="controls">
      <button class="btn ghost" id="openSettings" title="設定">⚙</button>
      <button class="btn secondary" id="resetBtn" title="重置">Reset</button>
      <button class="btn" id="startBtn" title="開始/暫停">Start</button>
    </div>

    <div class="top">
      <div class="badge">
        IN THE ZONE
        <span class="statusDot" id="dot"></span>
      </div>

      <div class="timer" id="timerText" role="button" aria-label="點一下開始暫停，長按重置，雙擊切換 Work/Break">25:00</div>
      <div class="hint" id="hint">Tap to Start • Hold to Reset • Double Tap to Switch</div>
    </div>

    <div class="bottom">
      <div class="g-wrap" aria-hidden="true">
        <div class="g">
          <div class="g-body"></div>
          <div class="g-hole"></div>
          <div class="g-cut"></div>
          <div class="eye left"><div class="pupil"></div></div>
          <div class="eye right"><div class="pupil"></div></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
          <div class="board">
            <div class="wheel left"></div>
            <div class="wheel right"></div>
          </div>
        </div>
      </div>
      <div class="road"></div>
    </div>

    <!-- 設定面板 -->
    <div class="sheet" id="sheet">
      <h3>設定</h3>

      <div class="row">
        <button class="pill" id="presetA">25/5</button>
        <button class="pill" id="presetB">50/10</button>
        <button class="pill light" id="closeSettings">關閉</button>
      </div>

      <div class="row">
        <div class="field">
          <label>Work (min)</label>
          <input type="number" id="workMin" min="1" max="180" step="1" />
        </div>
        <div class="field">
          <label>Break (min)</label>
          <input type="number" id="breakMin" min="1" max="60" step="1" />
        </div>
      </div>

      <div class="row">
        <button class="pill" id="applyBtn">套用</button>
        <button class="pill light" id="switchBtn">切換 Work/Break</button>
        <button class="pill light" id="skipBtn">跳到下一段</button>
      </div>

      <div class="row">
        <div class="toggle">
          <input type="checkbox" id="soundOn" />
          <label for="soundOn">提示音</label>
        </div>
        <div class="toggle">
          <input type="checkbox" id="notifyOn" />
          <label for="notifyOn">桌面通知</label>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ====== Pomodoro Core ======
    const timerEl = document.getElementById('timerText');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const dot = document.getElementById('dot');

    const controls = document.getElementById('controls');
    const sheet = document.getElementById('sheet');
    const openSettings = document.getElementById('openSettings');
    const closeSettings = document.getElementById('closeSettings');

    const presetA = document.getElementById('presetA');
    const presetB = document.getElementById('presetB');

    const workMinInput = document.getElementById('workMin');
    const breakMinInput = document.getElementById('breakMin');
    const applyBtn = document.getElementById('applyBtn');
    const switchBtn = document.getElementById('switchBtn');
    const skipBtn = document.getElementById('skipBtn');

    const soundOn = document.getElementById('soundOn');
    const notifyOn = document.getElementById('notifyOn');

    const KEY = "IN_THE_ZONE_POMODORO_V1";

    let state = {
      workMin: 25,
      breakMin: 5,
      phase: "work",          // "work" | "break"
      remaining: 25 * 60,     // seconds
      running: false,
      sound: true,
      notify: false
    };

    let intervalId = null;

    function load(){
      try{
        const raw = localStorage.getItem(KEY);
        if(!raw) return;
        const obj = JSON.parse(raw);
        if(!obj) return;
        state = { ...state, ...obj };
        // 防呆
        state.workMin = clampInt(state.workMin, 1, 180);
        state.breakMin = clampInt(state.breakMin, 1, 60);
        if(state.phase !== "work" && state.phase !== "break") state.phase = "work";
        if(typeof state.remaining !== "number" || state.remaining < 0) {
          state.remaining = state.workMin * 60;
        }
      }catch(e){}
    }

    function save(){
      try{
        localStorage.setItem(KEY, JSON.stringify({
          workMin: state.workMin,
          breakMin: state.breakMin,
          phase: state.phase,
          remaining: state.remaining,
          running: state.running,
          sound: state.sound,
          notify: state.notify
        }));
      }catch(e){}
    }

    function clampInt(v, min, max){
      v = parseInt(v, 10);
      if(Number.isNaN(v)) return min;
      return Math.max(min, Math.min(max, v));
    }

    function format(seconds){
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');
    }

    function updateUI(){
      timerEl.textContent = format(state.remaining);
      document.title = `${timerEl.textContent} · IN THE ZONE`;

      workMinInput.value = state.workMin;
      breakMinInput.value = state.breakMin;

      soundOn.checked = !!state.sound;
      notifyOn.checked = !!state.notify;

      startBtn.textContent = state.running ? "Pause" : "Start";

      dot.classList.toggle("running", state.running);
      dot.classList.toggle("break", state.phase === "break");
    }

    function beep(){
      if(!state.sound) return;
      try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = (state.phase === "work") ? 660 : 880;
        g.gain.value = 0.06;
        o.start();
        setTimeout(()=>{ o.stop(); ctx.close(); }, 160);
      }catch(e){}
    }

    async function notify(msg){
      if(!state.notify) return;
      if(!("Notification" in window)) return;

      if(Notification.permission === "default"){
        try{
          const p = await Notification.requestPermission();
          if(p !== "granted") return;
        }catch(e){ return; }
      }
      if(Notification.permission !== "granted") return;

      try{
        new Notification("IN THE ZONE", { body: msg });
      }catch(e){}
    }

    function setPhase(phase, resetRemaining=true){
      state.phase = phase;
      if(resetRemaining){
        state.remaining = (phase === "work" ? state.workMin : state.breakMin) * 60;
      }
      save();
      updateUI();
    }

    function nextPhase(){
      const next = (state.phase === "work") ? "break" : "work";
      setPhase(next, true);
      beep();
      notify(next === "break" ? "休息時間開始" : "工作時間開始");
    }

    function tick(){
      state.remaining--;
      if(state.remaining <= 0){
        state.remaining = 0;
        updateUI();
        nextPhase();
        return;
      }
      save();
      updateUI();
    }

    function start(){
      if(state.running) return;
      state.running = true;
      save();
      updateUI();
      intervalId = setInterval(tick, 1000);
    }

    function pause(){
      state.running = false;
      save();
      updateUI();
      if(intervalId) clearInterval(intervalId);
      intervalId = null;
    }

    function toggleRun(){
      state.running ? pause() : start();
    }

    function reset(){
      pause();
      state.remaining = (state.phase === "work" ? state.workMin : state.breakMin) * 60;
      save();
      updateUI();
    }

    // ====== Settings sheet ======
    function openSheet(){
      sheet.classList.add("open");
      controls.classList.add("show");
    }
    function closeSheet(){
      sheet.classList.remove("open");
      controls.classList.remove("show");
    }

    // ====== Gesture: tap / hold / double tap ======
    let holdTimer = null;
    let lastTap = 0;

    function onPointerDown(){
      // 長按重置（0.6s）
      holdTimer = setTimeout(()=>{ reset(); holdTimer = null; }, 600);
    }
    function onPointerUp(){
      if(holdTimer){
        clearTimeout(holdTimer);
        holdTimer = null;
      }
    }
    function onTap(){
      const now = Date.now();
      if(now - lastTap < 280){
        // double tap: switch
        pause();
        setPhase(state.phase === "work" ? "break" : "work", true);
        lastTap = 0;
        return;
      }
      lastTap = now;
      // single tap: start/pause
      toggleRun();
    }

    // ====== Wire events ======
    startBtn.addEventListener('click', toggleRun);
    resetBtn.addEventListener('click', reset);

    openSettings.addEventListener('click', openSheet);
    closeSettings.addEventListener('click', closeSheet);

    presetA.addEventListener('click', ()=>{
      state.workMin = 25; state.breakMin = 5;
      reset();
      save(); updateUI();
    });
    presetB.addEventListener('click', ()=>{
      state.workMin = 50; state.breakMin = 10;
      reset();
      save(); updateUI();
    });

    applyBtn.addEventListener('click', ()=>{
      const w = clampInt(workMinInput.value, 1, 180);
      const b = clampInt(breakMinInput.value, 1, 60);
      state.workMin = w;
      state.breakMin = b;
      reset(); // 套用後回到該段起始
      save(); updateUI();
    });

    switchBtn.addEventListener('click', ()=>{
      pause();
      setPhase(state.phase === "work" ? "break" : "work", true);
    });

    skipBtn.addEventListener('click', ()=>{
      pause();
      nextPhase();
    });

    soundOn.addEventListener('change', ()=>{
      state.sound = !!soundOn.checked;
      save(); updateUI();
    });

    notifyOn.addEventListener('change', async ()=>{
      state.notify = !!notifyOn.checked;
      save(); updateUI();
      if(state.notify && ("Notification" in window) && Notification.permission === "default"){
        try{ await Notification.requestPermission(); }catch(e){}
      }
    });

    // timer gestures
    timerEl.addEventListener('pointerdown', onPointerDown);
    timerEl.addEventListener('pointerup', onPointerUp);
    timerEl.addEventListener('pointercancel', onPointerUp);
    timerEl.addEventListener('click', (e)=>{
      // click 在長按後也可能觸發，避免誤判：如果剛剛觸發 reset，就不當 tap
      onTap();
    });

    // 點空白角落也可叫出控制（手機好用）
    document.getElementById('app').addEventListener('click', (e)=>{
      const rect = e.currentTarget.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      // 右上角 90x90：顯示控制列
      if(x > rect.width - 90 && y < 90){
        controls.classList.toggle("show");
      }
    });

    // ====== Init ======
    load();

    // 若之前存的是 running=true，為避免重新開頁就偷跑，這裡改成恢復為暫停狀態
    if(state.running){
      state.running = false;
      save();
    }
    // 若 remaining 不在合理範圍，修正
    const maxSec = Math.max(state.workMin, state.breakMin) * 60;
    if(state.remaining > maxSec) state.remaining = (state.phase === "work" ? state.workMin : state.breakMin) * 60;

    updateUI();
  </script>
</body>
</html>
